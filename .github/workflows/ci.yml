name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: build + smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 这个包没有任何运行时依赖（dev 脚本只用 node: 内置模块），但两套 DOM 测试要 jsdom。
      # 两个 jsdom 测试没装 jsdom 会自跳过，那样等于没测；CI 里临时装一份真跑。
      - name: 临时安装 jsdom（两个 DOM 测试都要）
        run: npm install --no-save --no-audit --no-fund jsdom

      - name: 构建客户端产物
        run: node scripts/build.mjs

      - name: 构建 IIROSE 脚本产物
        run: node scripts/build-iirose.mjs

      - name: 构建云函数产物（阿里云 FC / 腾讯云 SCF）
        run: |
          node scripts/build-relay.mjs
          node scripts/build-relay-cjs.mjs

      # 三个产物都是提交进仓库的（jsDelivr 只认仓库里的文件）：
      # 源码改了却忘了 build，这一步会红。
      - name: 提交的产物必须与源码一致
        run: git diff --exit-code -- lib/client.js iirose/music-iirose.js relay/serverless.js relay/serverless.cjs

      - name: 面板挂载 + 播放链路 smoke（DSH 版）
        run: node dev/smoke-client.mjs

      - name: 面板 UI（真实 DOM）
        run: node dev/panel-jsdom.mjs

      - name: IIROSE 点播帧 + 面板流程 smoke
        run: node dev/iirose-smoke.mjs

      - name: 云函数适配层 smoke（FC/SCF 两种 event 形状）
        run: node dev/serverless-smoke.mjs
